name: Release

# Pushing a tag like v1.0.1 builds every download from that tag's source and leaves a DRAFT
# release with SHA256SUMS.txt and build attestations; a person reads it and publishes it.
# "Run workflow" builds the same files from main as a dry run and keeps them as workflow
# artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          project=$(jq -r .version project.json)
          desktop=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' desktop/Directory.Build.props)
          echo "project.json $project, desktop $desktop"
          test "$project" = "$desktop"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "v$project" = "$GITHUB_REF_NAME"; fi
          echo "version=$project" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS download
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (tests, universal binary, ad-hoc signature)
        run: ./scripts/build-app.sh
      - name: Public build only
        run: |
          test ! -d Sources/OpenParallel/Private
          if grep -a -q -E 'NativeWhatsApp|PrivateExtensions|firstFileContainingOriginalIdentity|rewriteRules' dist/OpenParallel.app/Contents/MacOS/OpenParallel; then
            echo "The binary contains private-extension symbols." >&2
            exit 1
          fi
      - run: cp dist/OpenParallel.zip "OpenParallel-${{ needs.version.outputs.version }}-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: OpenParallel-*-mac.zip
          if-no-files-found: error

  desktop:
    name: Windows and Linux downloads
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        working-directory: desktop
        run: dotnet test --project tests/OpenParallel.Core.Tests
      - name: Build
        working-directory: desktop
        run: |
          bash scripts/build.sh --zip
          bash scripts/build-linux.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            desktop/artifacts/OpenParallel-*-windows-x64.zip
            desktop/artifacts/OpenParallel-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, macos, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: |
          ls -la
          test "$(ls | wc -l)" -eq 4
          sha256sum OpenParallel-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: files/OpenParallel-*
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" files/*
          --repo "$GITHUB_REPOSITORY" --draft
          --title "OpenParallel ${{ needs.version.outputs.version }}"
          --notes "Draft built from $GITHUB_REF_NAME ($GITHUB_SHA). Replace these notes before publishing."
